name: release

# Build the wheel + sdist and publish to PyPI when a GitHub Release is published
# (or via manual dispatch). Publishing uses PyPI Trusted Publishing (OIDC) for
# ZihaoLu001/flexiv_control -- no secret/token. `skip-existing` keeps manual
# re-dispatches idempotent (an already-published version is skipped, not an error).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check the wheel ships the configs (regression guard)
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          n = sum(x.endswith((".yaml", ".yml")) for x in zipfile.ZipFile(whl).namelist())
          print("yaml files in wheel:", n)
          sys.exit(0 if n >= 7 else 1)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Bind to a GitHub Environment so PyPI publishing can be gated. Enable
    # "Required reviewers" on the `pypi` environment in repo Settings ->
    # Environments to require a human approval before each release is published.
    environment:
      name: pypi
      url: https://pypi.org/p/flexiv-control
    # Trusted Publishing needs id-token write; harmless if a token is used instead.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Trusted Publishing (OIDC) -- no password/secret. skip-existing makes
          # a manual re-dispatch idempotent: an already-published version is
          # skipped instead of failing the run.
          skip-existing: true
