name: release

# Build the wheel + sdist and publish to PyPI when a GitHub Release is published
# (or via manual dispatch). To enable publishing, set up PyPI Trusted Publishing
# for ZihaoLu001/flexiv_control (recommended, no secret needed), OR add a
# PYPI_API_TOKEN repository secret and uncomment the `with: password:` line below.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check the wheel ships the configs (regression guard)
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          n = sum(x.endswith((".yaml", ".yml")) for x in zipfile.ZipFile(whl).namelist())
          print("yaml files in wheel:", n)
          sys.exit(0 if n >= 7 else 1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing needs id-token write; harmless if a token is used instead.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}   # uncomment if NOT using Trusted Publishing
