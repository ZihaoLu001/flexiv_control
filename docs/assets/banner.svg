<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="flexiv_control — a unified execution and safety layer for Flexiv Rizon arms">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#0e1422"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(980 150) rotate(90) scale(260 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19E3C4" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#19E3C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#19E3C4"/>
      <stop offset="1" stop-color="#4DA3FF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5C7CB0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="gridLg" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0H0V160" fill="none" stroke="#5C7CB0" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="340" fill="url(#gridLg)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>
  <!-- top accent rule -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>

  <!-- corner registration ticks (blueprint feel) -->
  <g stroke="#19E3C4" stroke-opacity="0.5" stroke-width="1.5">
    <path d="M40 28 h22 M40 28 v22"/>
    <path d="M1240 312 h-22 M1240 312 v-22"/>
  </g>

  <!-- ===== left: wordmark + tagline ===== -->
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
    <text x="60" y="120" font-size="20" fill="#19E3C4" letter-spacing="2">// real-robot controller</text>
    <text x="58" y="190" font-size="62" font-weight="700" fill="#E8EEF7" letter-spacing="-1">flexiv<tspan fill="#19E3C4">_</tspan>control</text>
    <text x="62" y="232" font-size="21" fill="#9FB2CC">one action contract · teleop · MPC · RL · real2sim2real</text>

    <!-- meta chips -->
    <g font-size="13" fill="#8aa0c0">
      <rect x="62" y="258" width="92" height="26" rx="4" fill="#121a2b" stroke="#23304a"/>
      <text x="76" y="275">Apache-2.0</text>
      <rect x="162" y="258" width="104" height="26" rx="4" fill="#121a2b" stroke="#23304a"/>
      <text x="176" y="275">Python ≥ 3.8</text>
      <rect x="274" y="258" width="150" height="26" rx="4" fill="#121a2b" stroke="#23304a"/>
      <text x="288" y="275">numpy-only core</text>
    </g>
  </g>

  <!-- ===== right: robot arm tracing a setpoint trajectory ===== -->
  <g transform="translate(956 86)">
    <!-- target workspace box -->
    <rect x="150" y="40" width="150" height="150" rx="6" fill="none" stroke="#4DA3FF" stroke-opacity="0.30" stroke-dasharray="4 5"/>
    <text x="150" y="30" font-family="'JetBrains Mono',monospace" font-size="11" fill="#4DA3FF" fill-opacity="0.8">workspace</text>

    <!-- planned trajectory arc -->
    <path d="M40 150 C 110 60, 200 60, 250 118" fill="none" stroke="#19E3C4" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="3 6"/>

    <!-- arm links -->
    <g stroke="url(#accent)" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M40 178 L 96 110"/>
      <path d="M96 110 L 178 96"/>
      <path d="M178 96 L 250 118"/>
    </g>
    <!-- joints -->
    <g fill="#0a0e16" stroke="#19E3C4" stroke-width="3">
      <circle cx="40" cy="178" r="11"/>
      <circle cx="96" cy="110" r="9"/>
      <circle cx="178" cy="96" r="9"/>
    </g>
    <!-- base -->
    <rect x="20" y="190" width="40" height="14" rx="3" fill="#1a2740" stroke="#2c4068"/>
    <!-- TCP / setpoint -->
    <circle cx="250" cy="118" r="7" fill="#19E3C4"/>
    <circle cx="250" cy="118" r="13" fill="none" stroke="#19E3C4" stroke-opacity="0.5"/>
    <path d="M250 100 v-12 M250 136 v12 M232 118 h-12 M268 118 h12" stroke="#19E3C4" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="262" y="150" font-family="'JetBrains Mono',monospace" font-size="11" fill="#19E3C4">TCP setpoint</text>
  </g>
</svg>
